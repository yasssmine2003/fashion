<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.bg-white]="isScrolled"
  [class.shadow-md]="isScrolled"
  [class.bg-white]="!isScrolled"
  [class.backdrop-blur-sm]="!isScrolled">
  
  <div class="container-custom">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center space-x-2 group">
          <div class="w-10 h-10 bg-gradient-to-br from-primary-pink to-primary-coral rounded-lg flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
            <span class="text-white font-bold text-xl">F</span>
          </div>
          <span class="text-2xl font-heading font-bold text-neutral-900 hidden sm:block">
            Fashion
          </span>
        </a>
      </div>

      <!-- Navigation Desktop -->
      <nav class="hidden md:flex items-center space-x-8">
        <a routerLink="/" routerLinkActive="text-primary-coral" [routerLinkActiveOptions]="{exact: true}" 
           class="text-neutral-700 hover:text-primary-coral font-medium transition-colors duration-300">
          Accueil
        </a>
        <a routerLink="/products" routerLinkActive="text-primary-coral"
           class="text-neutral-700 hover:text-primary-coral font-medium transition-colors duration-300">
          Produits
        </a>
        <a routerLink="/categories" routerLinkActive="text-primary-coral"
           class="text-neutral-700 hover:text-primary-coral font-medium transition-colors duration-300">
          Catégories
        </a>
        <a routerLink="/about" routerLinkActive="text-primary-coral"
           class="text-neutral-700 hover:text-primary-coral font-medium transition-colors duration-300">
          À propos
        </a>
        <a routerLink="/contact" routerLinkActive="text-primary-coral"
           class="text-neutral-700 hover:text-primary-coral font-medium transition-colors duration-300">
          Contact
        </a>
      </nav>

      <!-- Actions (Search, Cart, User) -->
      <div class="flex items-center space-x-4">
        
        <!-- Search Icon -->
        <button class="p-2 rounded-lg hover:bg-neutral-100 transition-colors duration-300 hidden sm:block"
          aria-label="Rechercher">
          <svg class="w-6 h-6 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>

        <!-- Cart -->
        <a routerLink="/cart" class="relative p-2 rounded-lg hover:bg-neutral-100 transition-colors duration-300">
          <svg class="w-6 h-6 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span *ngIf="cartItemCount > 0" 
            class="absolute -top-1 -right-1 bg-primary-coral text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
            {{ cartItemCount }}
          </span>
        </a>

        <!-- User Menu -->
        <div class="relative" *ngIf="isAuthenticated$ | async; else loginButton">
          <button (click)="toggleUserMenu()"
            class="flex items-center space-x-2 p-2 rounded-lg hover:bg-neutral-100 transition-colors duration-300">
            <img [src]="(currentUser$ | async)?.avatar || 'https://i.pravatar.cc/150'" 
              alt="User avatar"
              class="w-8 h-8 rounded-full object-cover">
            <span class="hidden lg:block text-sm font-medium text-neutral-700">
              {{ (currentUser$ | async)?.firstName }}
            </span>
            <svg class="w-4 h-4 text-neutral-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isUserMenuOpen"
            class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg py-2 animate-slide-down">
            
            <a *ngIf="isAdmin()" (click)="goToAdmin()" 
              class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50 cursor-pointer">
              🎛️ Dashboard Admin
            </a>
            
            <a (click)="goToProfile()" 
              class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50 cursor-pointer">
              👤 Mon Profil
            </a>
            
            <a routerLink="/orders" (click)="closeMenus()"
              class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50">
              📦 Mes Commandes
            </a>
            
            <a routerLink="/wishlist" (click)="closeMenus()"
              class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-50">
              ❤️ Favoris
            </a>
            
            <hr class="my-2">
            
            <button (click)="logout()"
              class="w-full text-left px-4 py-2 text-sm text-error hover:bg-neutral-50">
              🚪 Déconnexion
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <ng-template #loginButton>
          <a routerLink="/auth/login" class="btn-secondary text-sm px-6 py-2 hidden sm:block">
            Connexion
          </a>
        </ng-template>

        <!-- Mobile Menu Toggle -->
        <button (click)="toggleMobileMenu()"
          class="md:hidden p-2 rounded-lg hover:bg-neutral-100 transition-colors duration-300">
          <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMobileMenuOpen"
    class="md:hidden bg-white border-t border-neutral-200 animate-slide-down">
    <nav class="container-custom py-4 space-y-2">
      <a routerLink="/" (click)="closeMenus()"
        class="block px-4 py-3 rounded-lg text-neutral-700 hover:bg-neutral-50 font-medium">
        🏠 Accueil
      </a>
      <a routerLink="/products" (click)="closeMenus()"
        class="block px-4 py-3 rounded-lg text-neutral-700 hover:bg-neutral-50 font-medium">
        🛍️ Produits
      </a>
      <a routerLink="/categories" (click)="closeMenus()"
        class="block px-4 py-3 rounded-lg text-neutral-700 hover:bg-neutral-50 font-medium">
        📂 Catégories
      </a>
      <a routerLink="/about" (click)="closeMenus()"
        class="block px-4 py-3 rounded-lg text-neutral-700 hover:bg-neutral-50 font-medium">
        ℹ️ À propos
      </a>
      <a routerLink="/contact" (click)="closeMenus()"
        class="block px-4 py-3 rounded-lg text-neutral-700 hover:bg-neutral-50 font-medium">
        📧 Contact
      </a>
      
      <div *ngIf="!(isAuthenticated$ | async)" class="pt-4">
        <a routerLink="/auth/login" (click)="closeMenus()"
          class="block w-full btn-secondary text-center">
          Connexion
        </a>
      </div>
    </nav>
  </div>
</header>

<!-- Spacer pour compenser le header fixed -->
<div class="h-20"></div>
