<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
  
    <!-- Background Decorative Elements -->
    <div class="absolute inset-0 z-0">
      <!-- Gradient Background -->
      <div class="absolute inset-0 bg-gradient-to-br from-primary-yellow/20 via-primary-pink/20 to-accent-lavender/20"></div>
      
      <!-- Floating Circles -->
      <div class="absolute top-20 left-20 w-72 h-72 bg-primary-pink/30 rounded-full blur-3xl animate-pulse"></div>
      <div class="absolute bottom-20 right-20 w-96 h-96 bg-primary-yellow/30 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-accent-lavender/30 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
    </div>
  
    <!-- Login Container -->
    <div class="max-w-md w-full relative z-10" data-aos="fade-up">
      
      <!-- Glass Card -->
      <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 md:p-12 border border-white/20">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
          <!-- Logo -->
          <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-primary-pink to-primary-coral rounded-2xl mb-4 shadow-pink">
            <span class="text-white font-bold text-2xl">F</span>
          </div>
          
          <h2 class="text-3xl font-heading font-bold text-neutral-900 mb-2">
            Bienvenue ! 👋
          </h2>
          <p class="text-neutral-600">
            Connectez-vous à votre compte
          </p>
        </div>
  
        <!-- Demo Credentials (Pour faciliter les tests) -->
        <div class="mb-6 p-4 bg-primary-yellow/10 rounded-xl border border-primary-yellow/30">
          <p class="text-sm font-semibold text-neutral-700 mb-3">🎯 Test rapide :</p>
          <div class="flex gap-2">
            <button 
              (click)="quickLogin('admin')"
              type="button"
              class="flex-1 px-4 py-2 bg-primary-coral text-white text-sm rounded-lg hover:bg-primary-coral/90 transition-colors duration-300">
              👨‍💼 Admin
            </button>
            <button 
              (click)="quickLogin('user')"
              type="button"
              class="flex-1 px-4 py-2 bg-primary-pink text-white text-sm rounded-lg hover:bg-primary-pink/90 transition-colors duration-300">
              👤 User
            </button>
          </div>
        </div>
  
        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          
          <!-- Email Field -->
          <div>
            <label for="email" class="block text-sm font-semibold text-neutral-700 mb-2">
              Email
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </div>
              <input
                id="email"
                type="email"
                formControlName="email"
                placeholder="votre.email@exemple.com"
                class="input-field pl-12"
                [class.border-error]="email?.invalid && email?.touched">
            </div>
            
            <!-- Error Message -->
            <div *ngIf="email?.invalid && email?.touched" class="mt-2 text-sm text-error">
              <p *ngIf="email?.errors?.['required']">L'email est requis</p>
              <p *ngIf="email?.errors?.['email']">Email invalide</p>
            </div>
          </div>
  
          <!-- Password Field -->
          <div>
            <label for="password" class="block text-sm font-semibold text-neutral-700 mb-2">
              Mot de passe
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••"
                class="input-field pl-12 pr-12"
                [class.border-error]="password?.invalid && password?.touched">
              
              <!-- Toggle Password Visibility -->
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 pr-4 flex items-center text-neutral-400 hover:text-neutral-600 transition-colors duration-300">
                <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
            
            <!-- Error Message -->
            <div *ngIf="password?.invalid && password?.touched" class="mt-2 text-sm text-error">
              <p *ngIf="password?.errors?.['required']">Le mot de passe est requis</p>
              <p *ngIf="password?.errors?.['minlength']">Minimum 6 caractères</p>
            </div>
          </div>
  
          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <label class="flex items-center cursor-pointer group">
              <input
                type="checkbox"
                formControlName="rememberMe"
                class="w-5 h-5 text-primary-pink border-neutral-300 rounded focus:ring-primary-pink focus:ring-2 transition-all duration-300">
              <span class="ml-2 text-sm text-neutral-700 group-hover:text-primary-coral transition-colors duration-300">
                Se souvenir de moi
              </span>
            </label>
  
            <button
              type="button"
              (click)="goToForgotPassword()"
              class="text-sm font-semibold text-primary-coral hover:text-primary-pink transition-colors duration-300">
              Mot de passe oublié ?
            </button>
          </div>
  
          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="loading"
            class="w-full btn-primary bg-gradient-to-r from-primary-pink to-primary-coral hover:from-primary-coral hover:to-primary-pink text-white py-4 rounded-xl font-semibold text-lg shadow-pink hover:shadow-xl transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
            
            <span *ngIf="!loading">Se connecter</span>
            
            <!-- Loading Spinner -->
            <div *ngIf="loading" class="flex items-center gap-2">
              <div class="w-5 h-5 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
              <span>Connexion...</span>
            </div>
  
            <svg *ngIf="!loading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
          </button>
        </form>
  
        <!-- Divider -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-neutral-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-neutral-500">Ou continuer avec</span>
          </div>
        </div>
  
        <!-- Social Login -->
        <div class="grid grid-cols-3 gap-3">
          <button
            type="button"
            class="flex items-center justify-center px-4 py-3 border-2 border-neutral-200 rounded-xl hover:border-primary-pink hover:bg-primary-pink/5 transition-all duration-300 group">
            <svg class="w-5 h-5 text-neutral-700 group-hover:text-primary-pink transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
  
          <button
            type="button"
            class="flex items-center justify-center px-4 py-3 border-2 border-neutral-200 rounded-xl hover:border-primary-pink hover:bg-primary-pink/5 transition-all duration-300 group">
            <svg class="w-5 h-5 text-neutral-700 group-hover:text-primary-pink transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
            </svg>
          </button>
  
          <button
            type="button"
            class="flex items-center justify-center px-4 py-3 border-2 border-neutral-200 rounded-xl hover:border-primary-pink hover:bg-primary-pink/5 transition-all duration-300 group">
            <svg class="w-5 h-5 text-neutral-700 group-hover:text-primary-pink transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.164 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
            </svg>
          </button>
        </div>
  
        <!-- Register Link -->
        <p class="mt-8 text-center text-sm text-neutral-600">
          Pas encore de compte ?
          <button
            type="button"
            (click)="goToRegister()"
            class="font-bold text-primary-coral hover:text-primary-pink transition-colors duration-300 ml-1">
            Créer un compte
          </button>
        </p>
      </div>
  
      <!-- Back to Home -->
      <div class="text-center mt-6">
        <a routerLink="/" class="inline-flex items-center gap-2 text-sm text-neutral-600 hover:text-primary-coral transition-colors duration-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Retour à l'accueil
        </a>
      </div>
    </div>
  </div>
