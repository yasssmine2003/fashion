<section class="relative h-[600px] md:h-[700px] overflow-hidden">
  
    <!-- Slides Container -->
    <div class="relative h-full">
      <div 
        *ngFor="let slide of slides; let i = index"
        class="absolute inset-0 transition-opacity duration-700 ease-in-out"
        [class.opacity-100]="i === currentSlide"
        [class.opacity-0]="i !== currentSlide"
        [class.z-10]="i === currentSlide"
        [class.z-0]="i !== currentSlide">
        
        <!-- Background Color -->
        <div class="absolute inset-0" [style.background-color]="slide.bgColor"></div>
        
        <!-- Content -->
        <div class="container-custom h-full">
          <div class="grid md:grid-cols-2 gap-8 items-center h-full">
            
            <!-- Left Content -->
            <div class="z-20 animate-fade-in" data-aos="fade-right" data-aos-duration="1000">
              <h1 class="text-5xl md:text-7xl font-heading font-black text-neutral-900 mb-4 leading-tight">
                {{ slide.title }}<br>
                <span class="text-gradient-pink">{{ slide.subtitle }}</span>
              </h1>
              
              <p class="text-lg md:text-xl text-neutral-700 mb-8 max-w-md">
                {{ slide.description }}
              </p>
              
              <button 
                (click)="shopNow()"
                class="btn-primary group inline-flex items-center gap-3">
                {{ slide.buttonText }}
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform duration-300" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                </svg>
              </button>
            </div>
            
            <!-- Right Image -->
            <div class="relative h-[400px] md:h-[600px]" data-aos="fade-left" data-aos-duration="1000">
              <div class="absolute inset-0 flex items-center justify-center">
                <div class="relative">
                  <!-- Decorative Circle -->
                  <div class="absolute -inset-8 bg-white/30 rounded-full blur-3xl animate-pulse"></div>
                  
                  <!-- Image -->
                  <img 
                    [src]="slide.image" 
                    [alt]="slide.title"
                    class="relative w-[350px] h-[500px] object-cover rounded-3xl shadow-2xl transform hover:scale-105 transition-transform duration-500">
                  
                  <!-- Floating Badge -->
                  <div class="absolute -top-4 -right-4 bg-primary-coral text-white px-6 py-3 rounded-full shadow-lg animate-bounce-slow">
                    <span class="font-bold text-lg">NEW</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Navigation Arrows -->
    <button 
      (click)="prevSlide()"
      class="absolute left-4 top-1/2 -translate-y-1/2 z-30 w-12 h-12 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-lg hover:bg-white transition-all duration-300 hover:scale-110 group">
      <svg class="w-6 h-6 text-neutral-900 group-hover:-translate-x-0.5 transition-transform duration-300" 
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
  
    <button 
      (click)="nextSlide()"
      class="absolute right-4 top-1/2 -translate-y-1/2 z-30 w-12 h-12 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-lg hover:bg-white transition-all duration-300 hover:scale-110 group">
      <svg class="w-6 h-6 text-neutral-900 group-hover:translate-x-0.5 transition-transform duration-300" 
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  
    <!-- Dots Indicator -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 flex gap-3">
      <button 
        *ngFor="let slide of slides; let i = index"
        (click)="goToSlide(i)"
        class="transition-all duration-300"
        [class.w-12]="i === currentSlide"
        [class.w-3]="i !== currentSlide"
        [class.bg-neutral-900]="i === currentSlide"
        [class.bg-neutral-400]="i !== currentSlide"
        class="h-3 rounded-full hover:bg-neutral-900">
      </button>
    </div>
  
    <!-- Decorative Elements -->
    <div class="absolute top-20 right-20 w-32 h-32 bg-primary-pink/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-20 left-20 w-40 h-40 bg-primary-yellow/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
  </section>
