<!-- src/app/products/product-filter/product-filter.component.html -->
<div class="sticky top-24 space-y-6">
  
    <!-- Header -->
    <div class="flex justify-between items-center pb-4 border-b border-neutral-200">
      <h3 class="text-lg font-semibold text-neutral-900">Filtres</h3>
      <button 
        *ngIf="hasActiveFilters"
        (click)="clearFilters()"
        class="text-sm text-primary-pink hover:text-primary-coral transition-colors">
        Tout effacer
      </button>
    </div>
  
    <!-- Price Range -->
    <div class="space-y-4">
      <h4 class="font-medium text-neutral-900">Prix</h4>
      <div class="space-y-4">
        <div class="flex justify-between text-sm">
          <span>{{ priceRange.min }} TND</span>
          <span>{{ priceRange.max }} TND</span>
        </div>
        <input 
          type="range" 
          [(ngModel)]="priceRange.min"
          (change)="onPriceChange()"
          [min]="0" 
          [max]="500" 
          class="w-full h-2 bg-neutral-200 rounded-lg appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-primary-pink">
        <input 
          type="range" 
          [(ngModel)]="priceRange.max"
          (change)="onPriceChange()"
          [min]="0" 
          [max]="500" 
          class="w-full h-2 bg-neutral-200 rounded-lg appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-primary-pink">
      </div>
    </div>
  
    <!-- Categories -->
    <div class="space-y-3">
      <h4 class="font-medium text-neutral-900">Catégories</h4>
      <div class="space-y-2 max-h-60 overflow-y-auto pr-2">
        <div *ngFor="let category of categories" class="flex items-center justify-between">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input 
              type="checkbox"
              [checked]="selectedCategories.includes(category.value)"
              (change)="onCategoryChange(category.value, $event)"
              class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
            <span class="text-sm text-neutral-700">{{ category.label }}</span>
          </label>
          <span class="text-xs text-neutral-500 bg-neutral-100 px-2 py-1 rounded">
            {{ category.count }}
          </span>
        </div>
      </div>
    </div>
  
    <!-- Sizes -->
    <div class="space-y-3">
      <h4 class="font-medium text-neutral-900">Tailles</h4>
      <div class="flex flex-wrap gap-2">
        <label *ngFor="let size of sizes" 
               [class.bg-primary-pink]="selectedSizes.includes(size.value)"
               [class.text-white]="selectedSizes.includes(size.value)"
               [class.text-neutral-700]="!selectedSizes.includes(size.value)"
               class="relative cursor-pointer">
          <input 
            type="checkbox"
            [checked]="selectedSizes.includes(size.value)"
            (change)="onSizeChange(size.value, $event)"
            class="absolute opacity-0 w-0 h-0">
          <span class="inline-block w-10 h-10 border border-neutral-200 rounded-lg flex items-center justify-center text-sm font-medium hover:border-primary-pink transition-colors">
            {{ size.label }}
          </span>
        </label>
      </div>
    </div>
  
    <!-- Colors -->
    <div class="space-y-3">
      <h4 class="font-medium text-neutral-900">Couleurs</h4>
      <div class="flex flex-wrap gap-2">
        <label *ngFor="let color of colors" 
               [class.ring-2]="selectedColors.includes(color.value)"
               [class.ring-primary-pink]="selectedColors.includes(color.value)"
               class="relative cursor-pointer">
          <input 
            type="checkbox"
            [checked]="selectedColors.includes(color.value)"
            (change)="onColorChange(color.value, $event)"
            class="absolute opacity-0 w-0 h-0">
          <span 
            class="inline-block w-8 h-8 rounded-full border border-neutral-200 hover:scale-110 transition-transform"
            [style.background-color]="color.color"
            [title]="color.label">
          </span>
        </label>
      </div>
    </div>
  
    <!-- Brands -->
    <div class="space-y-3">
      <h4 class="font-medium text-neutral-900">Marques</h4>
      <div class="space-y-2 max-h-48 overflow-y-auto pr-2">
        <label *ngFor="let brand of brands" class="flex items-center space-x-2 cursor-pointer">
          <input 
            type="checkbox"
            [checked]="selectedBrands.includes(brand.value)"
            (change)="onBrandChange(brand.value, $event)"
            class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
          <span class="text-sm text-neutral-700">{{ brand.label }}</span>
        </label>
      </div>
    </div>
  
    <!-- Ratings -->
    <div class="space-y-3">
      <h4 class="font-medium text-neutral-900">Notes</h4>
      <div class="space-y-2">
        <label *ngFor="let rating of ratings" class="flex items-center space-x-2 cursor-pointer">
          <input 
            type="checkbox"
            [checked]="selectedRatings.includes(rating.value)"
            (change)="onRatingChange(rating.value, $event)"
            class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
          <div class="flex items-center">
            <svg *ngFor="let star of [1,2,3,4,5]" 
                 class="w-4 h-4"
                 [class.text-primary-yellow]="star <= rating.value"
                 [class.text-neutral-300]="star > rating.value"
                 fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
          </div>
          <span class="text-sm text-neutral-600">{{ rating.label }}</span>
        </label>
      </div>
    </div>
  
    <!-- Boolean Filters -->
    <div class="space-y-3">
      <h4 class="font-medium text-neutral-900">Autres</h4>
      <div class="space-y-2">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input 
            type="checkbox"
            [(ngModel)]="inStockOnly"
            (change)="onBooleanFilterChange()"
            class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
          <span class="text-sm text-neutral-700">En stock seulement</span>
        </label>
        <label class="flex items-center space-x-2 cursor-pointer">
          <input 
            type="checkbox"
            [(ngModel)]="onSaleOnly"
            (change)="onBooleanFilterChange()"
            class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
          <span class="text-sm text-neutral-700">Promotions</span>
        </label>
        <label class="flex items-center space-x-2 cursor-pointer">
          <input 
            type="checkbox"
            [(ngModel)]="newArrivalsOnly"
            (change)="onBooleanFilterChange()"
            class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
          <span class="text-sm text-neutral-700">Nouveautés</span>
        </label>
        <label class="flex items-center space-x-2 cursor-pointer">
          <input 
            type="checkbox"
            [(ngModel)]="trendingOnly"
            (change)="onBooleanFilterChange()"
            class="w-4 h-4 text-primary-pink rounded border-neutral-300 focus:ring-primary-pink focus:ring-2">
          <span class="text-sm text-neutral-700">Tendances</span>
        </label>
      </div>
    </div>
  
    <!-- Apply Button (mobile) -->
    <button 
      *ngIf="hasActiveFilters"
      (click)="applyFilters()"
      class="lg:hidden w-full btn-primary py-3">
      Appliquer les filtres
    </button>
  
  </div>
